<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Get in touch with me by filling out the contact form."
    />
    <title>Contact Me | My Portfolio</title>
  </head>
  <body>
    <header>
      <div><strong>[Logo] your name</strong></div>
      <nav>
        <a href="index.html">Home</a> / <a href="projects.html">Projects</a> /
        <a href="articles.html">Articles</a> /
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <hr />

    <main>
      <h1>Contact Me</h1>
      <p>
        Agar aap mujhse rabta karna chahte hain, toh neeche diya gaya form
        bharein:
      </p>

      <!-- Contact Form -->
      <form action="#" method="POST">
        <div>
          <label for="name">Name:</label><br />
          <input
            type="text"
            id="name"
            name="name"
            required
            placeholder="Enter your name"
          />
        </div>
        <br />
        <div>
          <label for="email">Email:</label><br />
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Enter your email"
          />
        </div>
        <br />
        <div>
          <label for="message">Message:</label><br />
          <textarea
            id="message"
            name="message"
            rows="5"
            cols="30"
            required
            placeholder="Write your message here..."
          ></textarea>
        </div>
        <br />
        <div>
          <button type="submit">Submit Solution</button>
        </div>
      </form>
    </main>

    <hr />

    <footer>
      <p style="text-align: center">&copy; all rights reserved 2026</p>
    </footer>
  </body>
</html>
